name: Verify N.E.K.O Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_ID: bililearn_bridge
  NEKO_REPOSITORY: Project-N-E-K-O/N.E.K.O
  NEKO_REF: fb78210ada6727ac9c5b3cb0376e5014ac4b1650

jobs:
  # 复刻官方 plugin-market-verify.yml 的校验流程（官方仓库未将 verify 流程加入
  # 跨仓库可复用白名单，故此处内联其步骤，仍使用官方 N.E.K.O 仓库的校验工具与逻辑）。
  market_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow inputs
        shell: bash
        run: |
          if [[ ! "$PLUGIN_ID" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "Invalid plugin id: $PLUGIN_ID" >&2
            exit 1
          fi

      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: plugin-repo

      - name: Checkout N.E.K.O
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NEKO_REPOSITORY }}
          ref: ${{ env.NEKO_REF }}
          path: neko

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff check
        run: >-
          uvx ruff==0.12.4 check --ignore-noqa --isolated
          --target-version py311 --line-length 120
          --select E4,E7,E9,F,I --exclude vendor plugin-repo

      - name: Mount plugin into N.E.K.O tree
        run: |
          rm -rf "neko/plugin/plugins/${PLUGIN_ID}"
          mkdir -p neko/plugin/plugins
          cp -R plugin-repo "neko/plugin/plugins/${PLUGIN_ID}"

      - name: Sync plugin dependencies
        working-directory: neko
        run: uv run --with pip python -m plugin.neko_plugin_cli.cli sync "${PLUGIN_ID}" --clean

      - name: Release check
        working-directory: neko
        run: |
          set -o pipefail
          mkdir -p plugin/neko_plugin_cli/target
          uv run python -m plugin.neko_plugin_cli.cli check -r "${PLUGIN_ID}" | tee "plugin/neko_plugin_cli/target/${PLUGIN_ID}.check-release.txt"

      - name: Write Market evidence
        working-directory: neko
        run: |
          PACKAGE="plugin/neko_plugin_cli/target/${PLUGIN_ID}.neko-plugin"
          EVIDENCE="plugin/neko_plugin_cli/target/market-evidence.json"
          test -f "$PACKAGE"
          export PACKAGE_SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          export NEKO_COMMIT="$(git rev-parse HEAD)"
          export EVIDENCE
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": 1,
              "mode": "verify",
              "plugin_id": os.environ["PLUGIN_ID"],
              "source_commit": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "neko_repository": os.environ["NEKO_REPOSITORY"],
              "neko_ref": os.environ["NEKO_REF"],
              "neko_commit": os.environ["NEKO_COMMIT"],
              "package": {
                  "name": f'{os.environ["PLUGIN_ID"]}.neko-plugin',
                  "sha256": os.environ["PACKAGE_SHA256"],
              },
          }
          Path(os.environ["EVIDENCE"]).write_text(
              json.dumps(evidence, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Market evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ID }}-market-evidence
          path: neko/plugin/neko_plugin_cli/target/market-evidence.json

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ID }}-verification
          path: |
            neko/plugin/neko_plugin_cli/target/${{ env.PLUGIN_ID }}.neko-plugin
            neko/plugin/neko_plugin_cli/target/${{ env.PLUGIN_ID }}.check-release.txt

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Run smoke tests
        # 用 unittest 而非 pytest：本插件按 N.E.K.O 规范把代码放在仓库根的 __init__.py，
        # pytest 会把仓库根当成包去 import __init__.py（触发 plugin.sdk 依赖报错）；
        # unittest 走命名空间包加载，不会执行根 __init__.py，规避该问题。
        run: |
          uv venv
          uv run python -m unittest tests.test_smoke -v
