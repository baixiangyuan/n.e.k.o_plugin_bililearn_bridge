name: Publish Plugin

# 说明：N.E.K.O 官方插件市场（workshop）的发布需要在运行中的 N.E.K.O 实例里操作，
# neko-plugin CLI 没有 publish 子命令，因此 CI 不直接发布到官方市场。
# 这里做的是"发布闭环"的自动化部分：每次发 GitHub Release 时，把插件构建成
# .neko-plugin 包并作为该 Release 的产物上传，供用户下载后用 neko-plugin install 安装。

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv
      - name: Build plugin package
        run: uv run neko-plugin build . -o bililearn_bridge.neko-plugin
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: bililearn_bridge.neko-plugin
